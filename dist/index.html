<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10251d" />
  <meta name="description" content="把中文翻成自然地道的英语口语。" />
  <title>Talk Like a Local</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310251d'/%3E%3Cpath d='M18 17h28v22H33l-9 8v-8h-6z' fill='%23e8f1df'/%3E%3Cpath d='M25 26h14M25 32h10' stroke='%2310251d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: light; --ink:#10251d; --muted:#65736c; --paper:#f6f4ed; --card:#fffefa; --lime:#d4ee83; --line:#d9ddd3; --accent:#18715b; }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
    .shell{max-width:1040px;margin:auto;padding:clamp(24px,5vw,64px) 22px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(34px,8vw,78px)}.brand{font-weight:800;letter-spacing:-.04em;font-size:1.2rem}.brand i{display:inline-block;width:.58em;height:.58em;border-radius:50%;background:var(--lime);margin-left:.35em}.tag{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
    h1{font-size:clamp(2.45rem,7vw,5.2rem);letter-spacing:-.075em;line-height:.98;margin:0 0 20px;max-width:760px}h1 em{font-style:normal;color:var(--accent)}.intro{color:var(--muted);font-size:1.08rem;line-height:1.65;margin:0 0 32px}
    .workbench{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px rgba(28,52,40,.08);overflow:hidden}.controls{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.pills{display:flex;background:#edf0e9;border-radius:999px;padding:4px;gap:2px}.pill{border:0;background:transparent;padding:8px 13px;border-radius:999px;font:inherit;font-size:.88rem;color:var(--muted);cursor:pointer}.pill.active{background:var(--ink);color:white}.hint{margin-left:auto;color:var(--muted);font-size:.83rem}
    .input-area{padding:24px 24px 18px}textarea{border:0;outline:0;width:100%;resize:none;min-height:130px;font:500 clamp(1.15rem,2.7vw,1.55rem)/1.55 inherit;color:var(--ink);background:transparent}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.mic{width:48px;height:48px;border:0;border-radius:50%;background:var(--lime);color:var(--ink);font-size:1.25rem;cursor:pointer;transition:.2s}.mic:hover{transform:scale(1.06)}.mic.listening{background:#ff9e87;animation:pulse 1s infinite}.translate{border:0;background:var(--accent);color:white;font:700 1rem inherit;padding:13px 19px;border-radius:14px;cursor:pointer}.translate:disabled{opacity:.55;cursor:wait}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,158,135,.25)}}
    .result{background:#eaf4df;padding:26px 24px;min-height:155px}.result-label{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.result-text{font-size:clamp(1.3rem,3.2vw,2rem);line-height:1.42;letter-spacing:-.025em;margin:14px 0 0;font-weight:650}.placeholder{color:#6d7d72;font-weight:500}.copy{border:0;background:transparent;color:var(--accent);font:700 .86rem inherit;cursor:pointer;padding:6px}.history{margin-top:34px}.history h2{font-size:1rem;margin:0 0 12px}.history-list{display:grid;gap:8px}.history-item{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.35);font-size:.94rem}.history-item span:first-child{color:var(--muted)}
    .note{font-size:.8rem;color:var(--muted);margin:18px 2px 0;line-height:1.55}@media(max-width:600px){.hint{display:none}.input-area{padding:20px}.result{padding:22px 20px}.history-item{grid-template-columns:1fr;gap:5px}h1{letter-spacing:-.06em}}
  </style>
</head>
<body><main class="shell"><header class="top"><div class="brand">Talk Like a Local<i></i></div><div class="tag">Chinese → English</div></header>
  <section><h1>说中文，<em>像当地人一样</em>用英语表达。</h1><p class="intro">不直译，优先给你自然、日常、真正会说出口的英文。</p>
  <div class="workbench"><div class="controls"><div class="pills" aria-label="英语风格"><button class="pill active" data-style="US">美式 English</button><button class="pill" data-style="UK">英式 English</button></div><span class="hint">输入中文，或点麦克风说话</span></div>
  <div class="input-area"><textarea id="source" aria-label="中文输入" placeholder="比如：我帮你找找碘伏棒和创可贴"></textarea><div class="actions"><button id="mic" class="mic" aria-label="语音输入" title="语音输入">●</button><button id="translate" class="translate">翻译成口语英文 ↗</button></div></div>
  <div class="result"><div class="result-label"><span id="resultLabel">Natural US English</span><button id="copy" class="copy" hidden>复制</button></div><p id="result" class="result-text placeholder">你的自然口语英文会出现在这里。</p></div></div>
  <section class="history" id="history" hidden><h2>刚刚翻过</h2><div class="history-list" id="historyList"></div></section><p class="note">语音识别需要浏览器授权麦克风。译文会优先按日常口语调整；复杂、俚语或语境依赖的句子，建议再发给我确认。</p></section></main>
<script>
 const source=document.querySelector('#source'), result=document.querySelector('#result'), translate=document.querySelector('#translate'), mic=document.querySelector('#mic'), copy=document.querySelector('#copy'), label=document.querySelector('#resultLabel'), history=document.querySelector('#history'), list=document.querySelector('#historyList');
 let style='US', items=JSON.parse(localStorage.getItem('localTranslatorHistory')||'[]');
 const examples={'我帮你找找碘伏棒和创可贴':{US:'Let me see if I can find some iodine swabs and Band-Aids for you.',UK:'Let me see if I can find some antiseptic swabs and plasters for you.'},'我觉得她长得有点像Sherry':{US:'I think she kind of looks like Sherry.',UK:'I think she looks a bit like Sherry.'},'不过没有她好看':{US:'But she’s not as pretty as Sherry.',UK:'But she’s not as pretty as Sherry.'},'五官有点像':{US:'Some of her features look similar, though.',UK:'Some of her features are quite similar, though.'}};
 function renderHistory(){if(!items.length)return;history.hidden=false;list.innerHTML=items.slice(0,4).map(x=>`<div class="history-item"><span>${x.cn}</span><strong>${x.en}</strong></div>`).join('')};renderHistory();
 document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');style=b.dataset.style;label.textContent=`Natural ${style} English`;});
 function polish(translation){let t=translation.trim().replace(/\bi am\b/gi,"I'm").replace(/\bdo not\b/gi,"don't").replace(/\bcannot\b/gi,"can't").replace(/\bI will\b/g,"I'll").replace(/\bI would\b/g,"I'd");if(style==='UK')t=t.replace(/\bBand-Aids?\b/gi,'plasters').replace(/\bapartment\b/gi,'flat').replace(/\bvacation\b/gi,'holiday');return t.charAt(0).toUpperCase()+t.slice(1)}
 async function makeTranslation(text){ const known=examples[text.trim()]?.[style]; if(known)return known; const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN%7Cen-US'); if(!r.ok)throw new Error('翻译服务暂时不可用，请稍后再试。');const data=await r.json();const translated=data?.responseData?.translatedText;if(!translated)throw new Error('这句暂时没翻出来，请换一种说法再试。');return polish(translated); }
 translate.onclick=async()=>{const text=source.value.trim();if(!text)return source.focus();translate.disabled=true;translate.textContent='正在润色…';try{const en=await makeTranslation(text);result.textContent=en;result.classList.remove('placeholder');copy.hidden=false;items.unshift({cn:text,en});items=items.slice(0,4);localStorage.setItem('localTranslatorHistory',JSON.stringify(items));renderHistory()}catch(e){result.textContent=e.message;result.classList.add('placeholder');copy.hidden=true}finally{translate.disabled=false;translate.textContent='翻译成口语英文 ↗'}};
 copy.onclick=async()=>{await navigator.clipboard.writeText(result.textContent);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制',1200)};
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){const recognition=new SpeechRecognition();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>mic.classList.add('listening');recognition.onend=()=>mic.classList.remove('listening');recognition.onresult=e=>{source.value=Array.from(e.results).map(r=>r[0].transcript).join('')};mic.onclick=()=>recognition.start()}else{mic.onclick=()=>alert('当前浏览器不支持语音识别。请使用最新版 Chrome 或 Edge。')}
</script></body></html>
