  <style>
    :root { color-scheme: light; --ink:#10251d; --muted:#65736c; --paper:#f6f4ed; --card:#fffefa; --lime:#d4ee83; --line:#d9ddd3; --accent:#18715b; }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
    .shell{max-width:1040px;margin:auto;padding:clamp(24px,5vw,64px) 22px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(34px,8vw,78px)}.brand{font-weight:800;letter-spacing:-.04em;font-size:1.2rem}.brand i{display:inline-block;width:.58em;height:.58em;border-radius:50%;background:var(--lime);margin-left:.35em}.tag{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
    h1{font-size:clamp(2.45rem,7vw,5.2rem);letter-spacing:-.075em;line-height:.98;margin:0 0 20px;max-width:760px}h1 em{font-style:normal;color:var(--accent)}.intro{color:var(--muted);font-size:1.08rem;line-height:1.65;margin:0 0 32px}
    .workbench{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px rgba(28,52,40,.08);overflow:hidden}.controls{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.pills{display:flex;background:#edf0e9;border-radius:999px;padding:4px;gap:2px}.pill{border:0;background:transparent;padding:8px 13px;border-radius:999px;font:inherit;font-size:.88rem;color:var(--muted);cursor:pointer}.pill.active{background:var(--ink);color:white}.hint{margin-left:auto;color:var(--muted);font-size:.83rem}
    .input-area{padding:24px 24px 18px}textarea{border:0;outline:0;width:100%;resize:none;min-height:130px;font:500 clamp(1.15rem,2.7vw,1.55rem)/1.55 inherit;color:var(--ink);background:transparent}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.mic{width:48px;height:48px;border:0;border-radius:50%;background:var(--lime);color:var(--ink);font-size:1.25rem;cursor:pointer;transition:.2s}.mic:hover{transform:scale(1.06)}.mic.listening{background:#ff9e87;animation:pulse 1s infinite}.translate{border:0;background:var(--accent);color:white;font:700 1rem inherit;padding:13px 19px;border-radius:14px;cursor:pointer}.translate:disabled{opacity:.55;cursor:wait}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,158,135,.25)}}

    .regional{display:none;margin-top:14px;padding-top:13px;border-top:1px solid rgba(24,113,91,.18);font-size:.9rem;line-height:1.5;color:#365448}.regional.show{display:block}.regional b{color:var(--accent)}.word{cursor:pointer;border-radius:5px;padding:0 1px;text-decoration:underline;text-decoration-color:rgba(24,113,91,.35);text-underline-offset:4px}.word:hover{background:#d5ef86}.word-card{position:fixed;z-index:10;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#10251d;color:#f7f7ef;border-radius:18px;padding:13px 18px 17px;box-shadow:0 18px 45px rgba(0,0,0,.25);font-size:.92rem;line-height:1.5}.word-card.expanded{left:16px!important;top:16px!important;width:calc(100vw - 32px);max-width:none;height:calc(100vh - 32px);max-height:none;border-radius:20px}.word-card .card-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:28px;margin:-5px -8px 8px -4px;cursor:grab;touch-action:none;user-select:none}.word-card .card-bar:active{cursor:grabbing}.word-card .card-title{font-size:.73rem;font-weight:800;letter-spacing:.08em;color:#d4ee83}.word-card .card-actions{display:flex;gap:2px}.word-card .card-actions button{border:0;background:transparent;color:white;font-size:1.1rem;line-height:1;padding:5px 7px;border-radius:7px;cursor:pointer}.word-card .card-actions button:hover{background:rgba(255,255,255,.14)}.word-card strong{font-size:1.16rem}.word-card .phonetic{color:#d4ee83;margin-left:8px}.word-card .meaning{margin-top:9px}.word-card .example{color:#cbd7d0;margin-top:7px;font-style:italic}.word-card .base{margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.18)}.word-card .base-label{color:#d4ee83;font-size:.73rem;font-weight:800;letter-spacing:.08em}.note{font-size:.8rem;color:var(--muted);margin:18px 2px 0;line-height:1.55}@media(max-width:600px){.hint{display:none}.input-area{padding:20px}.result{padding:22px 20px}.history-item{grid-template-columns:1fr;gap:5px}h1{letter-spacing:-.06em}}

<body><main class="shell"><header class="top"><div class="brand">Talk Like a Local<i></i></div><div class="tag">Chinese → English</div></header>
  <section><h1>说中文，<em>像当地人一样</em>用英语表达。</h1><p class="intro">不直译，优先给你自然、日常、真正会说出口的英文。</p>
  <div class="workbench"><div class="controls"><div class="pills" aria-label="英语风格"><button class="pill active" data-style="General">通用 English</button><button class="pill" data-style="US">美国</button><button class="pill" data-style="UK">英国</button><button class="pill" data-style="AU">澳大利亚</button><button class="pill" data-style="IE">爱尔兰</button></div><span class="hint">输入中文，或点麦克风说话</span></div>
  <div class="input-area"><textarea id="source" aria-label="中文输入" placeholder="比如：我帮你找找碘伏棒和创可贴"></textarea><div class="actions"><button id="mic" class="mic" aria-label="语音输入" title="语音输入">●</button><button id="translate" class="translate">翻译成口语英文 ↗</button></div></div>
  <div class="result"><div class="result-label"><span id="resultLabel">Natural General English</span><button id="copy" class="copy" hidden>复制</button></div><p id="result" class="result-text placeholder">你的自然口语英文会出现在这里。</p><div id="regional" class="regional"></div></div></div>
  <section class="history" id="history" hidden><h2>刚刚翻过</h2><div class="history-list" id="historyList"></div></section><p class="note">语音识别需要浏览器授权麦克风。译文会优先按日常口语调整；复杂、俚语或语境依赖的句子，建议再发给我确认。</p></section></main>
<script>
 const source=document.querySelector('#source'), result=document.querySelector('#result'), translate=document.querySelector('#translate'), mic=document.querySelector('#mic'), copy=document.querySelector('#copy'), label=document.querySelector('#resultLabel'), history=document.querySelector('#history'), list=document.querySelector('#historyList'),regional=document.querySelector('#regional');
 let style='General',latest='', items=JSON.parse(localStorage.getItem('localTranslatorHistory')||'[]');
 const examples={'我帮你找找碘伏棒和创可贴':{US:'Let me see if I can find some iodine swabs and Band-Aids for you.',UK:'Let me see if I can find some antiseptic swabs and plasters for you.'},'我觉得她长得有点像Sherry':{US:'I think she kind of looks like Sherry.',UK:'I think she looks a bit like Sherry.'},'不过没有她好看':{US:'But she’s not as pretty as Sherry.',UK:'But she’s not as pretty as Sherry.'},'五官有点像':{US:'Some of her features look similar, though.',UK:'Some of her features are quite similar, though.'}};
 function renderHistory(){if(!items.length)return;history.hidden=false;list.innerHTML=items.slice(0,4).map(x=>`<div class="history-item"><span>${x.cn}</span><strong>${x.en}</strong></div>`).join('')};renderHistory();
 function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderResult(text){result.innerHTML=text.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g).map(part=>/^[A-Za-z]/.test(part)?`<span class="word" data-word="${part.replace(/'/g,'&#39;')}">${escapeHtml(part)}</span>`:escapeHtml(part)).join('')}
const localWords={desensitize:{ipa:'/diːˈsensɪtaɪz/',zh:'使脱敏；使不敏感',definition:'to make someone or something less sensitive',example:'Working in an operating room desensitized me to the sight of blood.'}};function clean(s=''){return s.replace(/<[^>]*>/g,'').replace(/&[^;]+;/g,'').trim()}function findLemma(w){w=w.toLowerCase();if(/ing$/.test(w)){const stem=w.slice(0,-3);return stem.endsWith(stem.at(-1)+stem.at(-1))?stem.slice(0,-1):stem+'e'}if(/ied$/.test(w))return w.slice(0,-3)+'y';if(/ed$/.test(w))return w.slice(0,-2)+'e';if(/es$/.test(w))return w.slice(0,-2);if(/s$/.test(w))return w.slice(0,-1);return w}async function lookup(term){if(localWords[term])return localWords[term];const [d,z,w]=await Promise.all([fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(term)).then(r=>r.ok?r.json():[]).catch(()=>[]),fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(term)+'&langpair=en%7Czh-CN').then(r=>r.json()).catch(()=>null),fetch('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(term)).then(r=>r.ok?r.json():null).catch(()=>null)]),entry=d[0],def=entry?.meanings?.[0]?.definitions?.[0],wikiDef=w?.en?.[0]?.definitions?.[0];return {ipa:entry?.phonetics?.find(x=>x.text)?.text||entry?.phonetic||'',zh:z?.responseData?.translatedText||'',definition:def?.definition||clean(wikiDef?.definition),example:def?.example||wikiDef?.parsedExamples?.[0]?.example||''}}function cardBar(){return '<div class="card-bar"><span class="card-title">查词卡片 · 可拖动</span><div class="card-actions"><button class="card-expand" aria-label="放大窗口" title="放大 / 还原">⤢</button><button class="card-close" aria-label="关闭" title="关闭">×</button></div></div>'}function enableCardControls(card){const close=card.querySelector('.card-close'),expand=card.querySelector('.card-expand'),bar=card.querySelector('.card-bar');close.onclick=()=>card.remove();expand.onclick=()=>{card.classList.toggle('expanded');expand.textContent=card.classList.contains('expanded')?'⤡':'⤢';expand.setAttribute('aria-label',card.classList.contains('expanded')?'还原窗口':'放大窗口')};let startX,startY,startLeft,startTop;bar.onpointerdown=e=>{if(e.target.closest('button')||card.classList.contains('expanded'))return;startX=e.clientX;startY=e.clientY;startLeft=parseFloat(card.style.left)||0;startTop=parseFloat(card.style.top)||0;bar.setPointerCapture(e.pointerId);bar.onpointermove=m=>{card.style.left=Math.max(8,Math.min(window.innerWidth-card.offsetWidth-8,startLeft+m.clientX-startX))+'px';card.style.top=Math.max(8,Math.min(window.innerHeight-card.offsetHeight-8,startTop+m.clientY-startY))+'px'};bar.onpointerup=()=>{bar.onpointermove=null}}}async function showWord(word,rect){document.querySelector('.word-card')?.remove();const card=document.createElement('div');card.className='word-card';card.style.left=Math.max(16,Math.min(rect.left,window.innerWidth-350))+'px';card.style.top=Math.max(16,Math.min(rect.bottom+10,window.innerHeight-240))+'px';card.innerHTML=`${cardBar()}<strong>${escapeHtml(word)}</strong><span class="phonetic">正在查询…</span>`;document.body.append(card);enableCardControls(card);const lemma=findLemma(word),[current,base]=await Promise.all([lookup(word.toLowerCase()),lemma!==word.toLowerCase()?lookup(lemma):null]),show=(x,fallback)=>`<span class="phonetic">${escapeHtml(x?.ipa||fallback||'暂无音标')}</span><div class="meaning">${escapeHtml(x?.zh||'暂无翻译')}${x?.definition?' · '+escapeHtml(x.definition):''}</div>${x?.example?`<div class="example">“${escapeHtml(x.example)}”</div>`:''}`;card.innerHTML=`${cardBar()}<strong>${escapeHtml(word)}</strong>${show(current,base?.ipa)}${base?`<div class="base"><div class="base-label">原型 · BASE FORM</div><strong>${escapeHtml(lemma)}</strong>${show(base)}</div>`:''}`;enableCardControls(card);card.insertAdjacentHTML('beforeend','<div class="base"><div class="base-label">名著句子索引 · WIKISOURCE</div><div class="classic">正在检索经典文本…</div></div>');fetch('https://en.wikisource.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(word)+'&srlimit=3&format=json&origin=*').then(r=>r.json()).then(d=>{const e=card.querySelector('.classic'),rows=d?.query?.search||[];if(e)e.innerHTML=rows.length?rows.map(x=>'<div class="example">“'+clean(x.snippet)+'”<br>— '+escapeHtml(x.title)+'</div>').join(''):'暂未找到收录。'}).catch(()=>{const e=card.querySelector('.classic');if(e)e.textContent='暂时无法检索。'})}
 result.addEventListener('click',e=>{const target=e.target.closest('.word');if(target)showWord(target.dataset.word,target.getBoundingClientRect())});
 function regionNote(t){const name={General:'通用英语',US:'美国英语',UK:'英国英语',AU:'澳大利亚英语',IE:'爱尔兰英语'}[style],r=style==='UK'?t.replace(/Band-Aids?/gi,'plasters').replace(/vacation/gi,'holiday').replace(/apartment/gi,'flat'):style==='AU'?t.replace(/trash/gi,'rubbish').replace(/vacation/gi,'holiday'):style==='IE'?t.replace(/trash/gi,'rubbish').replace(/vacation/gi,'holiday'):t;regional.innerHTML=`<b>${name}怎么说</b><br>${escapeHtml(r)}${r===t?'：这句在该地区也很自然，通常没有必须替换的方言说法。':'：这里常用这样的本地词汇。'}`;regional.classList.toggle('show',!!t)}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');style=b.dataset.style;label.textContent=`Natural ${style} English`;regionNote(latest)});
 function polish(translation){let t=translation.trim().replace(/\bi am\b/gi,"I'm").replace(/\bdo not\b/gi,"don't").replace(/\bcannot\b/gi,"can't").replace(/\bI will\b/g,"I'll").replace(/\bI would\b/g,"I'd");if(style==='UK')t=t.replace(/\bBand-Aids?\b/gi,'plasters').replace(/\bapartment\b/gi,'flat').replace(/\bvacation\b/gi,'holiday');return t.charAt(0).toUpperCase()+t.slice(1)}
 async function makeTranslation(text){ const known=examples[text.trim()]?.[style]; if(known)return known; const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN%7Cen-US'); if(!r.ok)throw new Error('翻译服务暂时不可用，请稍后再试。');const data=await r.json();const translated=data?.responseData?.translatedText;if(!translated)throw new Error('这句暂时没翻出来，请换一种说法再试。');return polish(translated); }
 translate.onclick=async()=>{const text=source.value.trim();if(!text)return source.focus();translate.disabled=true;translate.textContent='正在润色…';try{const en=await makeTranslation(text);latest=en;renderResult(en);regionNote(en);result.classList.remove('placeholder');copy.hidden=false;items.unshift({cn:text,en});items=items.slice(0,4);localStorage.setItem('localTranslatorHistory',JSON.stringify(items));renderHistory()}catch(e){result.textContent=e.message;result.classList.add('placeholder');copy.hidden=true}finally{translate.disabled=false;translate.textContent='翻译成口语英文 ↗'}};
 copy.onclick=async()=>{await navigator.clipboard.writeText(result.textContent);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制',1200)};
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){const recognition=new SpeechRecognition();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>mic.classList.add('listening');recognition.onend=()=>mic.classList.remove('listening');recognition.onresult=e=>{source.value=Array.from(e.results).map(r=>r[0].transcript).join('')};mic.onclick=()=>recognition.start()}else{mic.onclick=()=>alert('当前浏览器不支持语音识别。请使用最新版 Chrome 或 Edge。')}
const naturalGreetings={'早上好':'Good morning.','早安':'Morning!','下午好':'Good afternoon.','晚上好':'Good evening.','晚安':'Good night.'};function polish(translation){let t=translation.trim();const letters=t.match(/[A-Za-z]/g)||[];const caps=t.match(/[A-Z]/g)||[];if(letters.length>2&&caps.length/letters.length>.85)t=t.toLowerCase();t=t.replace(/\bi am\b/gi,"I'm").replace(/\bdo not\b/gi,"don't").replace(/\bcannot\b/gi,"can't").replace(/\bI will\b/g,"I'll").replace(/\bI would\b/g,"I'd");if(style==='UK')t=t.replace(/\bBand-Aids?\b/gi,'plasters').replace(/\bapartment\b/gi,'flat').replace(/\bvacation\b/gi,'holiday');return t.charAt(0).toUpperCase()+t.slice(1)}async function makeTranslation(text){const cleaned=text.trim(),greeting=naturalGreetings[cleaned],known=examples[cleaned]?.[style];if(greeting)return greeting;if(known)return known;const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN%7Cen-US');if(!r.ok)throw new Error('翻译服务暂时不可用，请稍后再试。');const data=await r.json(),translated=data?.responseData?.translatedText;if(!translated)throw new Error('这句暂时没翻出来，请换一种说法再试。');return polish(translated)}function inflectedIpa(word,lemma,baseIpa){if(!baseIpa||word===lemma)return '';const core=baseIpa.replace(/^\//,'').replace(/\/$/,'');if(/ing$/i.test(word))return '/'+core.replace(/z$/,'zɪŋ').replace(/s$/,'sɪŋ').replace(/ŋ$/,'ŋ')+(core.endsWith('z')||core.endsWith('s')||core.endsWith('ŋ')?'':'ɪŋ')+'/';if(/ed$/i.test(word))return '/'+core+(core.endsWith('t')||core.endsWith('d')?'ɪd':'t')+'/';if(/s$/i.test(word))return '/'+core+(core.endsWith('s')||core.endsWith('z')||core.endsWith('ʃ')||core.endsWith('tʃ')?'ɪz':'z')+'/';return ''}
async function showWord(word,rect){document.querySelector('.word-card')?.remove();const card=document.createElement('div'),lower=word.toLowerCase(),lemma=findLemma(word);card.className='word-card';card.style.left=Math.max(16,Math.min(rect.left,window.innerWidth-350))+'px';card.style.top=Math.max(16,Math.min(rect.bottom+10,window.innerHeight-240))+'px';card.innerHTML=`${cardBar()}<strong>${escapeHtml(word)}</strong><span class="phonetic">正在查询…</span>`;document.body.append(card);enableCardControls(card);const[current,base]=await Promise.all([lookup(lower),lemma!==lower?lookup(lemma):null]),show=(x,ipa)=>`<span class="phonetic">${escapeHtml(ipa||'暂无音标')}</span><div class="meaning">${escapeHtml(x?.zh||'暂无翻译')}${x?.definition?' · '+escapeHtml(x.definition):''}</div>${x?.example?`<div class="example">“${escapeHtml(x.example)}”</div>`:''}`,currentIpa=current?.ipa||inflectedIpa(lower,lemma,base?.ipa);card.innerHTML=`${cardBar()}${base?'<div class="base-label">当前词形 · CURRENT FORM</div>':''}<strong>${escapeHtml(word)}</strong>${show(current,currentIpa)}${base?`<div class="base"><div class="base-label">原型 · BASE FORM</div><strong>${escapeHtml(lemma)}</strong>${show(base,base.ipa)}</div>`:''}`;enableCardControls(card);card.insertAdjacentHTML('beforeend','<div class="base"><div class="base-label">名著句子索引 · WIKISOURCE</div><div class="classic">正在检索经典文本…</div></div>');fetch('https://en.wikisource.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(word)+'&srlimit=3&format=json&origin=*').then(r=>r.json()).then(d=>{const e=card.querySelector('.classic'),rows=d?.query?.search||[];if(e)e.innerHTML=rows.length?rows.map(x=>'<div class="example">“'+clean(x.snippet)+'”<br>— '+escapeHtml(x.title)+'</div>').join(''):'暂未找到收录。'}).catch(()=>{const e=card.querySelector('.classic');if(e)e.textContent='暂时无法检索。'})}
</script></body></html>
